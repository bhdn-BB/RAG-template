# Ukrainian RAG: full local stack behind nginx (http://localhost).
#
# Usage (from the repository root):
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml --profile qdrant up -d --build
#
# Profiles select the vector store (match VECTOR_STORE in .env):
#   qdrant | pgvector | weaviate
# Optional:
#   vllm-llm    -> self-hosted Qwen LLM on vLLM (needs extra VRAM, see README)
#
# GPU: vllm-* services need the NVIDIA Container Toolkit (on Windows: Docker Desktop + WSL2).

name: ukrainian-rag

x-vllm: &vllm
  image: vllm/vllm-openai:v0.10.1.1
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - hf-cache:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 20
    start_period: 600s  # first start downloads the model

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    image: ukrainian-rag-api:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      WORKERS: ${WORKERS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama on the host
    depends_on:
      qdrant:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false
      weaviate:
        condition: service_started
        required: false

  ui:
    build:
      context: ..
      dockerfile: deploy/docker/ui.Dockerfile
    image: ukrainian-rag-ui:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/api/v1
    depends_on:
      - api

  # --- Model servers (vLLM) --------------------------------------------------
  # One 24 GB GPU: 8B embedder (~16 GB bf16) + 0.6B reranker.
  vllm-embed:
    <<: *vllm
    command: >
      --model Qwen/Qwen3-Embedding-8B
      --task embed
      --dtype bfloat16
      --max-model-len 8192
      --gpu-memory-utilization 0.75

  vllm-rerank:
    <<: *vllm
    command: >
      --model Qwen/Qwen3-Reranker-0.6B
      --task score
      --dtype bfloat16
      --max-model-len 8192
      --gpu-memory-utilization 0.15
      --hf-overrides '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'

  vllm-llm:
    <<: *vllm
    profiles: ["vllm-llm"]
    command: >
      --model Qwen/Qwen3-8B-AWQ
      --max-model-len 16384
      --gpu-memory-utilization 0.9

  # --- Vector stores (pick one via profile) ----------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["qdrant"]
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: ["pgvector"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    profiles: ["weaviate"]
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate

volumes:
  hf-cache:
  qdrant-data:
  pg-data:
  weaviate-data:
