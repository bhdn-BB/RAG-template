# Reverse proxy: one local entry point (http://localhost) for the API and the Streamlit UI.
#   /api/...  -> FastAPI (incl. Swagger at /api/v1/docs, SSE streaming)
#   /         -> Streamlit (needs WebSocket upgrade)

upstream rag_api {
    server api:8000;
    keepalive 16;
}

upstream rag_ui {
    server ui:8501;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;  # keep >= MAX_UPLOAD_MB

    # Basic hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion (embedding big files) and LLM calls can be slow.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Server-Sent Events: don't buffer streamed tokens.
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://rag_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
