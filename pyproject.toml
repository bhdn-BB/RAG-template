[project]
name = "ukrainian-rag"
version = "0.1.0"
description = "Ukrainian RAG backend: FastAPI + vLLM (Qwen3) + LangGraph, hybrid BM25/dense search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "weaviate-client>=4.9",
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=1.0",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2.50",
    "pypdf>=5.1",
    "docx2txt>=0.8",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-uk>=2.4",
    "sse-starlette>=2.1",
    "nltk>=3.10.4",
    "dishka>=1.10.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "requests>=2.32"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
